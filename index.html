<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASEAN Ltd · Intranet Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0D1F3C;--navy-2:#1A3056;--gold:#C9A84C;--gold-lt:#E8D5A0;
  --teal:#1A7C78;--teal-lt:#E0F2F1;--bg:#F0F2F7;--white:#fff;
  --border:#E2E6F0;--text:#1A2035;--text2:#4A5568;--text3:#8A97B0;
  --sw:240px;--hh:60px;--r:10px;--rs:6px
}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
.app{display:flex;height:100vh;overflow:hidden}
/* SIDEBAR */
.sidebar{width:var(--sw);background:var(--navy);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sb-logo{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo-name{font-family:'DM Serif Display',serif;font-size:19px;color:var(--gold);letter-spacing:.3px}
.logo-sub{font-size:10px;color:rgba(255,255,255,.35);margin-top:3px;text-transform:uppercase;letter-spacing:1px}
nav{padding:12px 8px;flex:1}
.nav-sec{font-size:10px;color:rgba(255,255,255,.28);text-transform:uppercase;letter-spacing:1px;padding:12px 12px 5px}
.ni{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--rs);cursor:pointer;transition:all .15s;color:rgba(255,255,255,.6);font-size:13px;margin-bottom:1px}
.ni:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.9)}
.ni.active{background:var(--gold);color:var(--navy);font-weight:500}
.ni svg{width:15px;height:15px;flex-shrink:0}
.nbadge{margin-left:auto;background:rgba(255,255,255,.12);color:rgba(255,255,255,.6);font-size:11px;padding:1px 7px;border-radius:10px}
.ni.active .nbadge{background:rgba(13,31,60,.2);color:var(--navy)}
.sb-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08)}
.ucard{display:flex;align-items:center;gap:10px}
.uavatar{width:34px;height:34px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--navy);flex-shrink:0}
.uname{font-size:13px;color:rgba(255,255,255,.85);font-weight:500}
.urole{font-size:11px;color:rgba(255,255,255,.38)}
/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.header{height:var(--hh);background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:14px}
.htitle{font-family:'DM Serif Display',serif;font-size:18px;color:var(--text);white-space:nowrap}
.hsearch{flex:1;max-width:360px;position:relative}
.hsearch input{width:100%;padding:7px 12px 7px 33px;border:1px solid var(--border);border-radius:20px;background:var(--bg);font-size:13px;color:var(--text);outline:none;font-family:inherit}
.hsearch input:focus{border-color:var(--teal);background:#fff}
.sico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.hactions{margin-left:auto;display:flex;align-items:center;gap:8px}
.content{flex:1;overflow-y:auto;padding:28px 32px}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:var(--rs);font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:inherit;transition:all .15s;text-decoration:none}
.btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{background:var(--navy-2)}
.btn-gold{background:var(--gold);color:var(--navy)}.btn-gold:hover{background:#b8932d}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover{background:var(--bg)}
.btn-danger{background:#fee2e2;color:#b91c1c}.btn-danger:hover{background:#fecaca}
.btn-sm{padding:5px 11px;font-size:12px}
/* CARDS */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.card-sm{padding:14px 16px}
/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;border-left:4px solid transparent}
.slabel{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.sval{font-size:28px;font-family:'DM Serif Display',serif;color:var(--text);line-height:1}
.ssub{font-size:11px;color:var(--text3);margin-top:5px}
/* SECTION HEADER */
.sh{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:10px}
.sh-left h2{font-family:'DM Serif Display',serif;font-size:22px;color:var(--text)}
.sh-left p{font-size:13px;color:var(--text3);margin-top:2px}
/* NEWS */
.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.nc{background:#fff;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:border-color .15s}
.nc:hover{border-color:var(--teal)}
.nc-bar{height:7px}
.nc-body{padding:16px}
.nc-tag{display:inline-block;font-size:11px;font-weight:500;padding:2px 9px;border-radius:10px;margin-bottom:8px}
.nc-title{font-size:15px;font-weight:500;color:var(--text);line-height:1.4;margin-bottom:6px}
.nc-sum{font-size:13px;color:var(--text2);line-height:1.55;margin-bottom:12px}
.nc-meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text3)}
.pin-b{background:#fef3c7;color:#92400e;padding:2px 7px;border-radius:10px;font-size:11px}
/* DOCS */
.folder-tabs{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap}
.ftab{padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text2);transition:all .15s}
.ftab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:12px}
.dc{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:16px;transition:border-color .15s}
.dc:hover{border-color:var(--teal)}
.dc-icon{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:10px}
.dc-name{font-size:13px;font-weight:500;color:var(--text);margin-bottom:4px;line-height:1.3;word-break:break-word}
.dc-meta{font-size:11px;color:var(--text3)}
/* DIRECTORY */
.member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.mc{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:20px 16px;text-align:center;transition:border-color .15s}
.mc:hover{border-color:var(--teal)}
.mavatar{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;margin:0 auto 12px;color:#fff}
.mname{font-size:14px;font-weight:500;color:var(--text);margin-bottom:3px}
.mrole{font-size:12px;color:var(--text3);margin-bottom:6px}
.mdept{font-size:11px;padding:3px 10px;border-radius:10px;display:inline-block;margin-bottom:12px}
.mc-btns{display:flex;gap:5px;justify-content:center}
.cbtn{padding:5px 10px;border-radius:var(--rs);font-size:11px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--text2);transition:all .15s;text-decoration:none}
.cbtn:hover{background:var(--teal);color:#fff;border-color:var(--teal)}
/* CALENDAR */
.cal-wrap{display:grid;grid-template-columns:1fr 1.35fr;gap:22px}
.cal-grid{background:#fff;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.cdh{display:grid;grid-template-columns:repeat(7,1fr);background:var(--bg)}
.cdhl{text-align:center;padding:8px 2px;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.cdates{display:grid;grid-template-columns:repeat(7,1fr)}
.cdate{min-height:50px;padding:5px;border-top:1px solid var(--border);border-right:1px solid var(--border);cursor:pointer;transition:background .1s;position:relative}
.cdate:hover{background:#f8f9fe}
.cdate.om .dn{color:var(--text3);opacity:.35}
.cdate.today .dn{background:var(--navy);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.cdate.hase::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--gold);position:absolute;bottom:4px;right:5px}
.dn{font-size:12px;font-weight:500;color:var(--text);line-height:22px}
.ev-panel{display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 220px);overflow-y:auto}
.ev-card{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.ev-type{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.ev-title{font-size:14px;font-weight:500;color:var(--text);margin-bottom:5px}
.ev-detail{font-size:12px;color:var(--text3);line-height:1.7}
/* WORKING GROUPS */
.wg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.wc{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:20px}
.wc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.wst{font-size:11px;padding:3px 10px;border-radius:10px;font-weight:500}
.wname{font-size:15px;font-weight:600;color:var(--text);margin-bottom:5px}
.wdesc{font-size:13px;color:var(--text2);line-height:1.55;margin-bottom:12px}
.wchair{font-size:12px;color:var(--text3);margin-bottom:10px}
.wmembers{display:flex;margin-bottom:12px}
.wma{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff;border:2px solid #fff;margin-right:-8px}
.wmmore{width:28px;height:28px;border-radius:50%;background:var(--bg);border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text3)}
.wact{font-size:12px;color:var(--text3);padding-top:12px;border-top:1px solid var(--border)}
/* QUICK LINKS */
.ql-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.qlc{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:18px 16px;cursor:pointer;transition:all .15s}
.qlc:hover{border-color:var(--teal);transform:translateY(-1px)}
.ql-ico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:10px}
.ql-name{font-size:13px;font-weight:500;color:var(--text);margin-bottom:3px}
.ql-desc{font-size:12px;color:var(--text3)}
/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.toolbar input,.toolbar select{padding:7px 12px;border:1px solid var(--border);border-radius:var(--rs);font-size:13px;font-family:inherit;color:var(--text);outline:none;background:#fff}
.toolbar input:focus,.toolbar select:focus{border-color:var(--teal)}
.toolbar input{min-width:220px}
/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal{background:#fff;border-radius:14px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.mh{padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between}
.mtitle{font-family:'DM Serif Display',serif;font-size:20px;color:var(--text)}
.mb{padding:18px 24px}
.mf{padding:12px 24px 20px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--border);margin-top:6px}
.fg{margin-bottom:15px}
.fl{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.4px}
.fi{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--rs);font-size:13px;font-family:inherit;color:var(--text);outline:none;transition:border-color .15s}
.fi:focus{border-color:var(--teal)}
textarea.fi{resize:vertical;min-height:75px}
/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:11px 18px;border-radius:var(--r);font-size:13px;z-index:2000;display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(8px);transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
/* ANIM */
.page{animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
/* SCROLL */
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
/* RESPONSIVE */
@media(max-width:1024px){.stats-grid{grid-template-columns:repeat(2,1fr)}.cal-wrap{grid-template-columns:1fr}}
@media(max-width:700px){.sidebar{width:200px}:root{--sw:200px}}
/* PINNED */
.pinned-bar{display:flex;flex-direction:column;gap:9px;margin-bottom:26px}
.pb-item{background:#fff;border:1px solid var(--border);border-radius:var(--r);border-left:4px solid var(--gold);display:flex;align-items:center;gap:14px;padding:13px 16px;cursor:pointer}
.pb-item:hover{border-color:var(--teal);border-left-color:var(--gold)}
</style>
</head>

      <span class="nbadge" id="b-cal">0</span>
    </div>
    <div class="ni" data-page="groups" onclick="go('groups',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>

    <div class="ni" data-page="links" onclick="go('links',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
      Quick Links
      <span class="nbadge" id="b-links">0</span>
    </div>
  </nav>
  <div class="sb-foot">
    <div class="ucard">
      <div class="uavatar">MR</div>
      <div><div class="uname">Mithun Chakraborty</div><div class="urole">Director</div></div>
    </div>
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <header class="header">
    <span class="htitle" id="htitle">Dashboard</span>
    <div class="hsearch">
      <svg class="sico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" placeholder="Search intranet…" id="gsearch" oninput="globalSearch(this.value)">
    </div>
    <div class="hactions">
      <button class="btn btn-primary btn-sm" id="hadd" onclick="headerAdd()" style="display:none">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add New
      </button>
    </div>
  </header>
  <div class="content" id="content"></div>
</div>
</div>

<!-- MODAL -->
<div class="modal-ov" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="mh">
      <span class="mtitle" id="mtitle"></span>
      <button onclick="closeModal()" style="background:transparent;border:none;font-size:20px;cursor:pointer;color:var(--text3);line-height:1">×</button>
    </div>
    <div class="mb" id="mbody"></div>
    <div class="mf" id="mfoot"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

let S = {};

// ─────────────────────────────────────────────
// STORAGE
// ─────────────────────────────────────────────
async function load(){
  try{
    const r = await window.storage.get('asean-intranet-v1');
    S = r && r.value ? JSON.parse(r.value) : deepCopy(DEFAULTS);
    if(!r||!r.value) await save();
  }catch(e){ S = deepCopy(DEFAULTS); }
  badges(); render();
}
async function save(){ try{ await window.storage.set('asean-intranet-v1',JSON.stringify(S)); }catch(e){} }
function deepCopy(o){ return JSON.parse(JSON.stringify(o)); }

const TITLES = {dashboard:'Dashboard',news:'News & Announcements',docs:'Document Library',directory:'Member Directory',calendar:'Events Calendar',groups:'Working Groups',links:'Quick Links'};

function go(p, el){
  page = p;
  document.querySelectorAll('.ni').forEach(n=>n.classList.remove('active'));
  if(el) el.classList.add('active');
  else document.querySelector(`[data-page="${p}"]`).classList.add('active');
  document.getElementById('htitle').textContent = TITLES[p];
  document.getElementById('hadd').style.display = p==='dashboard' ? 'none' : '';
  filters = {docQ:'',dirQ:'',dirDept:'All',newsQ:''};
  docFolder='All'; linkCat='';
  render();
}

function render(){
  const c = document.getElementById('content');
  c.innerHTML=''; c.className='content page';
  ({dashboard:rDash,news:rNews,docs:rDocs,directory:rDir,calendar:rCal,groups:rGroups,links:rLinks})[page]();
}

function headerAdd(){
  ({news:addNews,docs:addDoc,directory:addMem,calendar:addEvent,groups:addGroup,links:addLink})[page]();
}

function badges(){
  if(!S.news) return;
  document.getElementById('b-news').textContent = S.news.length;
  document.getElementById('b-docs').textContent = S.docs.length;
  document.getElementById('b-dir').textContent  = S.members.length;
  document.getElementById('b-cal').textContent  = S.events.length;
  document.getElementById('b-wg').textContent   = S.groups.length;
  document.getElementById('b-links').textContent= S.links.length;
}

  const upcoming = [...S.events].sort((a,b)=>new Date(a.date)-new Date(b.date)).filter(e=>new Date(e.date)>=today).slice(0,4);
  const recent  = [...S.news].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,4);
  const pinned  = S.news.filter(n=>n.pinned);
  const activeGroups = S.groups.filter(g=>g.status==='Active').length;
  const c = document.getElementById('content');

  c.innerHTML = `
  <div class="stats-grid">
    ${sc(S.members.length,'Staff & Members','#1A7C78','↑ 3 this month')}
    ${sc(S.docs.length,'Documents','#C9A84C','Across 5 folders')}

      <span class="pin-b">📌 Pinned</span>
    </div>`).join('')}
  </div>`:``}

  <div style="display:grid;grid-template-columns:1.6fr 1fr;gap:24px">
    <div>
      <div class="sh"><div class="sh-left"><h2>Recent News</h2></div><button class="btn btn-ghost btn-sm" onclick="go('news')">View all →</button></div>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${recent.map(n=>`
          <div class="card card-sm" style="cursor:pointer;border-left:3px solid ${n.color}" onclick="go('news')">
            <span class="nc-tag" style="background:${n.color}22;color:${n.color}">${n.cat}</span>
            <div style="font-weight:500;font-size:14px;margin-bottom:3px">${n.title}</div>
            <div style="font-size:12px;color:var(--text3)">${n.author} · ${fd(n.date)}</div>
          </div>`).join('')}

    </div>
    <div>

      <div style="display:flex;flex-direction:column;gap:10px">
        ${upcoming.map(e=>`
          <div class="card card-sm">
            <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:${tc(e.type)};margin-bottom:4px">${fds(e.date)} · ${e.type}</div>
            <div style="font-weight:500;font-size:13px;margin-bottom:3px">${e.title}</div>
            <div style="font-size:12px;color:var(--text3)">${e.time} · ${e.loc.split(',')[0]}</div>
          </div>`).join('')}
        ${upcoming.length===0?'<div style="color:var(--text3);font-size:13px;padding:10px 0">No upcoming events</div>':''}
      </div>
    </div>
  </div>`;
}

function sc(v,l,col,sub){
  return `<div class="stat-card" style="border-left-color:${col}"><div class="slabel">${l}</div><div class="sval">${v}</div><div class="ssub">${sub}</div></div>`;
}

function rNews(){
  const q = filters.newsQ.toLowerCase();
  const items = S.news.filter(n=>!q||n.title.toLowerCase().includes(q)||n.cat.toLowerCase().includes(q)||n.sum.toLowerCase().includes(q));
  const cats = ['All',...new Set(S.news.map(n=>n.cat))];
  document.getElementById('content').innerHTML = `
    <div class="toolbar">
      <input type="text" placeholder="Search announcements…" value="${filters.newsQ}" oninput="filters.newsQ=this.value;rNews()">
      <select onchange="filters.newsCat=this.value;rNews()" style="cursor:pointer">
        ${cats.map(c=>`<option>${c}</option>`).join('')}
      </select>
    </div>
    <div class="news-grid">
      ${items.map(n=>`
        <div class="nc">
          <div class="nc-bar" style="background:${n.color}"></div>

// ─────────────────────────────────────────────
// CALENDAR
// ─────────────────────────────────────────────
function rCal(){
  const y=calMonth.getFullYear(), mo=calMonth.getMonth();
  const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const fd0=new Date(y,mo,1).getDay();
  const dim=new Date(y,mo+1,0).getDate();
  const dipm=new Date(y,mo,0).getDate();
  const start=(fd0===0?6:fd0-1);
  const today='2026-04-16';
  const evMo=S.events.filter(e=>{const d=new Date(e.date);return d.getFullYear()===y&&d.getMonth()===mo});
  let cells='';
  for(let i=start;i>0;i--) cells+=`<div class="cdate om"><span class="dn">${dipm-i+1}</span></div>`;
  for(let d=1;d<=dim;d++){
    const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const he=evMo.some(e=>e.date===ds);
    cells+=`<div class="cdate${ds===today?' today':''}${he?' hase':''}"><span class="dn">${d}</span></div>`;
  }
  for(let d=1;d<=(42-(start+dim));d++) cells+=`<div class="cdate om"><span class="dn">${d}</span></div>`;
  const sorted=[...S.events].sort((a,b)=>new Date(a.date)-new Date(b.date));
  document.getElementById('content').innerHTML=`
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:22px">
      <div style="display:flex;gap:4px">
        <button onclick="calNav(-1)" style="width:30px;height:30px;border:1px solid var(--border);background:#fff;border-radius:var(--rs);cursor:pointer;font-size:15px;color:var(--text2)">‹</button>
        <button onclick="calNav(1)" style="width:30px;height:30px;border:1px solid var(--border);background:#fff;border-radius:var(--rs);cursor:pointer;font-size:15px;color:var(--text2)">›</button>
      </div>
      <span style="font-family:'DM Serif Display',serif;font-size:20px">${MONTHS[mo]} ${y}</span>
      <button class="btn btn-ghost btn-sm" onclick="calMonth=new Date(2026,3,1);rCal()">Today</button>
    </div>
    <div class="cal-wrap">
      <div class="cal-grid">
        <div class="cdh">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="cdhl">${d}</div>`).join('')}</div>
        <div class="cdates">${cells}</div>
      </div>
      <div class="ev-panel">
        <div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">All Events</div>
        ${sorted.map(e=>`
          <div class="ev-card">
            <div class="ev-type" style="color:${tc(e.type)}">${e.type} · ${fds(e.date)}</div>
            <div class="ev-title">${e.title}</div>
            <div class="ev-detail">🕐 ${e.time}<br>📍 ${e.loc}<br>👤 ${e.org}</div>
            <div style="display:flex;gap:6px;margin-top:10px">
              <button class="btn btn-ghost btn-sm" onclick="editEv(${e.id})">Edit</button>
              <button class="btn btn-danger btn-sm" onclick="del('events',${e.id})">Delete</button>
            </div>
          </div>`).join('')}
        ${sorted.length===0?'<div style="text-align:center;padding:30px;color:var(--text3)">No events scheduled.</div>':''}
      </div>
    </div>`;
}

function calNav(d){ calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+d,1);rCal(); }

// ─────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────
function del(col,id){
  if(!confirm('Delete this item?'))return;
  S[col]=S[col].filter(x=>x.id!==id);
  save();badges();render();toast('Item deleted');
}

function tc(type){return{Internal:'#1A7C78',External:'#C9A84C','Working Group':'#7c3aed'}[type]||'#0D1F3C'}

function fd(s){return new Date(s+'T00:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}
function fds(s){return new Date(s+'T00:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short'})}

function gv(id){const e=document.getElementById(id);return e?e.value.trim():''}
function esc(s){return(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function globalSearch(q){
  if(!q.trim())return;
  // Simple: filter across all sections on next navigate
}

// MODAL
function modal(title,body,onSave){
  document.getElementById('mtitle').textContent=title;
  document.getElementById('mbody').innerHTML=body;
  document.getElementById('mfoot').innerHTML=`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="__save()">Save</button>`;
  window.__save=onSave;
  document.getElementById('modal').style.display='flex';
  setTimeout(()=>{const f=document.querySelector('#mbody .fi');if(f)f.focus();},50);
}
function closeModal(){document.getElementById('modal').style.display='none'}

// TOAST
function toast(msg){
  const t=document.getElementById('toast');
  t.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> ${msg}`;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}
